[package]
name = "rm-search"
description = "Offline place and address search for ReflectMaps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
deunicode = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.27"

[[bin]]
name = "rm-search-build"
path = "src/bin/build.rs"

[[bin]]
name = "rm-search-query"
path = "src/bin/query.rs"

[[bin]]
name = "rm-search-eval"
path = "src/bin/eval.rs"
